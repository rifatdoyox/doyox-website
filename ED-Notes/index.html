<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ED নোটস - ইঞ্জিনিয়ারিং ড্রইং</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f4f7fc;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      padding: 1.5rem;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.8rem;
      margin: 2rem 0;
    }
    .note-card {
      background: white;
      border-radius: 1.5rem;
      padding: 1.5rem;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      border: 1px solid #e2edf7;
    }
    .note-card:hover { transform: translateY(-5px); box-shadow: 0 16px 28px rgba(0,0,0,0.1); }
    .card-icon svg { width: 44px; height: 44px; stroke: #1e3c72; margin-bottom: 1rem; }
    .note-card h3 { font-size: 1.3rem; color: #1a2c4e; margin-bottom: 0.5rem; }
    .badge {
      display: inline-block;
      background: #eef2ff;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      margin-top: 1rem;
    }
    .hidden { display: none; }
    .topic-section {
      background: white;
      border-radius: 1.5rem;
      padding: 1.5rem;
      margin: 1rem 0;
    }
    .topic-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid #eef2ff;
    }
    .back-btn {
      background: #eef2ff;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      max-height: 400px;
      overflow-y: auto;
    }
    .topic-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem;
      background: #f9fbfd;
      border-radius: 1rem;
      cursor: pointer;
      border: 1px solid #eff3f8;
      transition: 0.2s;
    }
    .topic-item:hover { background: #f0f4f9; transform: translateX(4px); }
    .topic-icon svg { width: 22px; height: 22px; stroke: #3b5f8a; }
    .topic-text { flex: 1; font-weight: 500; color: #1e3a5f; }
    .page-badge { font-size: 0.7rem; background: #e9edf2; padding: 0.2rem 0.6rem; border-radius: 20px; }
    .viewer-wrapper { margin-top: 1rem; border-radius: 1rem; overflow: hidden; background: #eef2ff; }
    .pdf-embed { width: 100%; height: 70vh; border: none; }
    .download-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #1e3c72;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      text-decoration: none;
      font-size: 0.8rem;
      margin-top: 0.8rem;
    }
    .footer { text-align: center; margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; color: #7a8aa8; font-size: 0.75rem; }
    @media (max-width: 640px) { body { padding: 1rem; } .pdf-embed { height: 55vh; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Engineering Drawing Notes</h1>
    <p>ইঞ্জিনিয়ারিং ড্রইং – অধ্যায় ও ড্রইং লিস্ট</p>
  </div>

  <!-- মূল কার্ড -->
  <div id="cardsSection" class="cards-grid">
    <div class="note-card" data-chapter="isometric">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <line x1="9" y1="9" x2="15" y2="15" />
          <line x1="15" y1="9" x2="9" y2="15" />
        </svg>
      </div>
      <h3>Isometric Drawing</h3>
      <p>সমান কৌণিক অভিক্ষেপ – অধ্যায় ২</p>
      <span class="badge">PDF · ১.২ MB</span>
    </div>
    <div class="note-card" data-chapter="projection">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M2 20L22 20" />
          <path d="M6 4L6 16" />
          <path d="M18 4L18 16" />
          <rect x="10" y="4" width="4" height="12" />
        </svg>
      </div>
      <h3>Projection</h3>
      <p>অর্থোগ্রাফিক ও বিভিন্ন অভিক্ষেপ</p>
      <span class="badge">PDF · ০.৯৫ MB</span>
    </div>
  </div>

  <!-- লিস্ট এবং পিডিএফ ভিউয়ার (প্রথমে লুকানো) -->
  <div id="detailSection" class="hidden">
    <div class="topic-section" id="topicListSection">
      <div class="topic-header">
        <span id="topicListTitle"></span>
        <button id="closeTopicsBtn" class="back-btn">← সব নোটস</button>
      </div>
      <div id="topicListContainer" class="topic-list"></div>
    </div>

    <div id="pdfViewerSection" class="hidden topic-section">
      <div class="topic-header">
        <span id="pdfTitle"></span>
        <button id="backToListBtn" class="back-btn">← লিস্টে ফিরুন</button>
      </div>
      <div class="viewer-wrapper">
        <iframe id="pdfFrame" class="pdf-embed" src=""></iframe>
      </div>
      <a id="downloadLink" class="download-link" href="#" download>ডাউনলোড PDF</a>
    </div>
  </div>

  <div class="footer">© 2025 doyox.com – All rights reserved</div>
</div>

<script>
  // ---------- ড্রইং লিস্ট (আপনার PDF অনুযায়ী এডিট করুন) ----------
  const drawingData = {
    isometric: {
      pdfFile: "2. Isometric Drawing.pdf",
      title: "Isometric Drawing (সমান কৌণিক অভিক্ষেপ)",
      drawings: [
        { name: "অক্ষর H – সমান কৌণিক অভিক্ষেপ", page: 1 },
        { name: "অক্ষর N – সমান কৌণিক অভিক্ষেপ", page: 3 },
        { name: "অক্ষর X – আইসোমেট্রিক ড্রইং", page: 4 },
        { name: "অক্ষর F – আইসোমেট্রিক ড্রইং", page: 5 },
        { name: "অক্ষর T – আইসোমেট্রিক ড্রইং", page: 6 },
        { name: "৩টি ধাপ বিশিষ্ট সিঁড়ি", page: 7 },
        { name: "পঞ্চভূজ প্রিজম", page: 8 },
        { name: "পিরামিড – আইসোমেট্রিক ভিউ", page: 9 },
        { name: "বৃত্তের আইসোমেট্রিক", page: 12 },
        { name: "সিলিন্ডার (ব্যাস ৪, উচ্চতা ৭)", page: 13 }
      ]
    },
    projection: {
      pdfFile: "3. Projection.pdf",
      title: "Projection (অভিক্ষেপ)",
      drawings: [
        { name: "কাঠের টুকরার সমকৌণিক অভিক্ষেপ", page: 3 },
        { name: "বিন্দুর অভিক্ষেপ (ভূপৃষ্ঠ থেকে 1”)", page: 4 },
        { name: "সরলরেখার অভিক্ষেপ (ভিপি থেকে 0.5”)", page: 5 },
        { name: "সরলরেখা ভূমিতে লম্বভাবে", page: 8 },
        { name: "30° কোণে রেখা – ভূমিতে", page: 9 },
        { name: "বর্গাকার পাতের অভিক্ষেপ (ভূমির সমান্তরাল)", page: 13 },
        { name: "বর্গাকার পাতা 45° নত – এক কর্ণ সোজা", page: 14 },
        { name: "সুষম পঞ্চভূজ পাতা – 80° কোণে", page: 16 },
        { name: "প্রিজম (ভূমি 60°, অক্ষ 45°)", page: 20 },
        { name: "সিলিন্ডারের অভিক্ষেপ (45° নত)", page: 28 }
      ]
    }
  };

  // DOM রেফারেন্স
  const cardsSection = document.getElementById('cardsSection');
  const detailSection = document.getElementById('detailSection');
  const topicListSection = document.getElementById('topicListSection');
  const pdfViewerSection = document.getElementById('pdfViewerSection');
  const topicListContainer = document.getElementById('topicListContainer');
  const topicListTitle = document.getElementById('topicListTitle');
  const pdfFrame = document.getElementById('pdfFrame');
  const pdfTitle = document.getElementById('pdfTitle');
  const downloadLink = document.getElementById('downloadLink');
  const closeTopicsBtn = document.getElementById('closeTopicsBtn');
  const backToListBtn = document.getElementById('backToListBtn');

  let currentPdfPath = '';
  let currentChapter = '';

  // লিস্ট দেখানো
  function showTopicList(chapter) {
    currentChapter = chapter;
    const data = drawingData[chapter];
    if (!data) return;
    currentPdfPath = `./pdfs/${encodeURIComponent(data.pdfFile)}`;
    topicListTitle.innerText = `📄 ${data.title}`;
    
    topicListContainer.innerHTML = '';
    data.drawings.forEach(d => {
      const item = document.createElement('div');
      item.className = 'topic-item';
      item.innerHTML = `
        <div class="topic-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
        </div>
        <div class="topic-text">${escapeHtml(d.name)}</div>
        <div class="page-badge">পৃষ্ঠা ${d.page}</div>
      `;
      item.addEventListener('click', () => openPdfAtPage(d.page));
      topicListContainer.appendChild(item);
    });
    
    cardsSection.classList.add('hidden');
    detailSection.classList.remove('hidden');
    topicListSection.classList.remove('hidden');
    pdfViewerSection.classList.add('hidden');
    pdfFrame.src = ''; // আগের ভিউয়ার খালি
  }

  function openPdfAtPage(pageNum) {
    // পিডিএফ URL + পৃষ্ঠা নম্বর (বেশিরভাগ ভিউয়ার #page= সাপোর্ট করে)
    const url = `${currentPdfPath}#page=${pageNum}`;
    pdfFrame.src = url;
    pdfTitle.innerText = `📖 ${drawingData[currentChapter].title} – পৃষ্ঠা ${pageNum}`;
    downloadLink.href = currentPdfPath;
    topicListSection.classList.add('hidden');
    pdfViewerSection.classList.remove('hidden');
  }

  function backToTopicList() {
    pdfViewerSection.classList.add('hidden');
    topicListSection.classList.remove('hidden');
    pdfFrame.src = '';
  }

  function closeAllAndBackToCards() {
    detailSection.classList.add('hidden');
    cardsSection.classList.remove('hidden');
    pdfViewerSection.classList.add('hidden');
    topicListSection.classList.remove('hidden');
    pdfFrame.src = '';
  }

  // কার্ডে ক্লিক ইভেন্ট
  document.querySelectorAll('.note-card').forEach(card => {
    card.addEventListener('click', (e) => {
      const chapter = card.getAttribute('data-chapter');
      if (chapter === 'isometric') showTopicList('isometric');
      else if (chapter === 'projection') showTopicList('projection');
    });
  });

  closeTopicsBtn.addEventListener('click', closeAllAndBackToCards);
  backToListBtn.addEventListener('click', backToTopicList);

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }
</script>
</body>
</html>
